<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Fynlo — Business Management Platform</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #1e293b;
    background: #f8fafc;
  }

  /* ============ AUTH SCREEN ============ */
  #auth-root {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
  }
  .auth-card {
    background: white;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .auth-card h1 {
    font-size: 24px;
    margin-bottom: 6px;
    color: #4f46e5;
  }
  .auth-card p { color: #64748b; font-size: 13px; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { background: #4338ca; }
  .err { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ============ APP SHELL ============ */
  /* NOTE: no display:none baked in here — JS controls visibility ONLY via this one class toggle */
  #app-root { display: none; }
  #app-root.show { display: block; }

  .topbar {
    background: white;
    border-bottom: 1px solid #e2e8f0;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar .brand { font-weight: 800; font-size: 18px; color: #4f46e5; }
  .topbar .right { display: flex; align-items: center; gap: 12px; }
  .topbar button {
    background: #f1f5f9;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .layout {
    display: flex;
    min-height: calc(100vh - 57px);
  }
  .sidebar {
    width: 220px;
    background: white;
    border-right: 1px solid #e2e8f0;
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 20px;
    background: none;
    border: none;
    font-size: 14px;
    cursor: pointer;
    color: #475569;
  }
  .sidebar button:hover { background: #f1f5f9; }
  .sidebar button.active { background: #ede9fe; color: #4f46e5; font-weight: 700; }

  #page-content {
    flex: 1;
    padding: 28px;
    overflow-y: auto;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 18px;
  }
  .stat-card .val { font-size: 24px; font-weight: 800; }
  .stat-card .label { font-size: 12px; color: #64748b; margin-top: 4px; }

  .card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
  }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    #page-content { padding: 16px; }
  }
</style>
</head>
<body>

<!-- ══════════════ AUTH SCREEN ══════════════ -->
<div id="auth-root">
  <div class="auth-card">
    <h1>Fynlo</h1>
    <p>Sign in to your account</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@company.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn" id="login-btn">Sign In</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<!-- ══════════════ APP SHELL ══════════════ -->
<div id="app-root">
  <div class="topbar">
    <div class="brand">Fynlo</div>
    <div class="right">
      <span id="user-name-label"></span>
      <button id="logout-btn">Logout</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar-nav"></div>
    <div id="page-content"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════
const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:3000/api'
  : 'https://fynlo-production-3664.up.railway.app/api';

// ════════════════════════════════════════════════════════
// AUTH STORAGE
// ════════════════════════════════════════════════════════
const Auth = {
  getToken: () => localStorage.getItem('fynlo_token'),
  setToken: (t) => localStorage.setItem('fynlo_token', t),
  getUser:  () => { try { return JSON.parse(localStorage.getItem('fynlo_user')); } catch { return null; } },
  setUser:  (u) => localStorage.setItem('fynlo_user', JSON.stringify(u)),
  clear:    () => { localStorage.removeItem('fynlo_token'); localStorage.removeItem('fynlo_user'); },
};

// ════════════════════════════════════════════════════════
// API HELPER
// ════════════════════════════════════════════════════════
async function api(endpoint, options = {}) {
  const token = Auth.getToken();
  const res = await fetch(API_BASE_URL + endpoint, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...options.headers,
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}
const GET = (url) => api(url);
const POST = (url, body) => api(url, { method: 'POST', body: JSON.stringify(body) });

// ════════════════════════════════════════════════════════
// THE ONE FUNCTION THAT CONTROLS SCREEN SWITCHING
// This is intentionally the ONLY place that toggles auth-root / app-root.
// No inline styles are ever set on these two elements anywhere else in the code.
// ════════════════════════════════════════════════════════
function showApp(user) {
  document.getElementById('auth-root').style.display = 'none';
  document.getElementById('app-root').classList.add('show');
  document.getElementById('user-name-label').textContent = user.name || user.email;
  buildSidebar(user);
  loadPage('dashboard');
}

function showAuth() {
  document.getElementById('app-root').classList.remove('show');
  document.getElementById('auth-root').style.display = 'flex';
}

// ════════════════════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════════════════════
document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';

  if (!email || !password) { errEl.textContent = 'Please fill in all fields'; return; }

  try {
    const data = await POST('/auth/login', { email, password });
    if (!data.token) { errEl.textContent = 'Login failed — no token received'; return; }
    Auth.setToken(data.token);
    Auth.setUser(data.user);
    showApp(data.user);
  } catch (err) {
    errEl.textContent = err.message || 'Login failed';
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  Auth.clear();
  showAuth();
});

// ════════════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════════════
function buildSidebar(user) {
  const isAdmin = user.role === 'admin';
  const pages = isAdmin
    ? [['dashboard','Dashboard'], ['businesses','Businesses']]
    : [['dashboard','Dashboard'], ['inventory','Inventory'], ['invoices','Invoices']];

  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = pages.map(([id, label]) =>
    `<button data-page="${id}" onclick="loadPage('${id}')">${label}</button>`
  ).join('');
}

// ════════════════════════════════════════════════════════
// PAGE LOADER
// ════════════════════════════════════════════════════════
async function loadPage(page) {
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
  const activeBtn = document.querySelector(`.sidebar button[data-page="${page}"]`);
  if (activeBtn) activeBtn.classList.add('active');

  const el = document.getElementById('page-content');
  el.innerHTML = '<p style="padding:20px;color:#94a3b8;">Loading...</p>';

  try {
    if (page === 'dashboard') {
      const stats = await GET('/dashboard').catch(() => ({}));
      el.innerHTML = `
        <h2 style="margin-bottom:20px;">Dashboard</h2>
        <div class="stat-grid">
          <div class="stat-card"><div class="val">₹${(stats.todaysSales||0).toLocaleString()}</div><div class="label">Today's Sales</div></div>
          <div class="stat-card"><div class="val">${stats.activeProducts||0}</div><div class="label">Active Products</div></div>
          <div class="stat-card"><div class="val">${stats.staffCount||0}</div><div class="label">Staff</div></div>
        </div>
        <div class="card">
          <p>If you can see this box with a border, the core app shell is rendering correctly. ✅</p>
        </div>`;
    } else {
      el.innerHTML = `<div class="card"><p>${page} page — to be built.</p></div>`;
    }
  } catch (err) {
    el.innerHTML = `<div class="card"><p style="color:#ef4444;">Failed to load: ${err.message}</p></div>`;
  }
}

// ════════════════════════════════════════════════════════
// INIT — restore session on page load
// ════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const token = Auth.getToken();
  const user = Auth.getUser();
  if (token && user) {
    showApp(user);
  } else {
    showAuth();
  }
});
</script>
</body>
</html>
